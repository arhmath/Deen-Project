<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fffcf3" />
    <!-- Anti-flash: pasang class "dark" SEBELUM render pertama (logikanya sama dengan src/app/theme.tsx). -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("deen-theme");
          var dark =
            pref === "dark" ||
            ((pref === null || pref === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (dark) root.classList.add("dark");
          root.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#150d22" : "#fffcf3");
        } catch (e) {}
      })();
    </script>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fffcf3;
        z-index: 9999;
      }
      #initial-loader-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(130, 49, 242, 0.18);
        border-top-color: #8231f2;
        border-radius: 50%;
        animation: initial-loader-spin 0.75s linear infinite;
      }
      .dark #initial-loader { background: #150d22; }
      .dark #initial-loader-spinner { border-color: rgba(183, 140, 255, 0.22); border-top-color: #b78cff; }
      @keyframes initial-loader-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader-spinner { animation-duration: 1.8s; }
      }
    </style>
    <!-- Font: preconnect + stylesheet non-blocking (tidak lagi lewat @import di CSS, yang membuat rantai CSS -> font CSS -> woff2). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@700&display=swap" /></noscript>
    <link rel="icon" type="image/svg+xml" href="/logoo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO dasar -->
    <meta
      name="description"
      content="Deen adalah platform belajar Islam interaktif untuk santri TPA. Pelajari materi keislaman, kerjakan kuis, kumpulkan XP, dan pantau progres belajar dengan cara yang menyenangkan."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://web-deen.vercel.app/" />

    <!-- Identitas aplikasi -->
    <meta name="application-name" content="Deen" />
    <meta name="author" content="Tim Deen" />

    <!-- Open Graph: preview saat dibagikan -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="Deen" />
    <meta property="og:title" content="Deen — Belajar Islam Jadi Menyenangkan" />
    <meta
      property="og:description"
      content="Platform belajar Islam interaktif untuk santri TPA, dilengkapi materi, kuis, XP, dan progres belajar."
    />
    <meta property="og:url" content="https://web-deen.vercel.app/" />
    <meta property="og:image" content="https://web-deen.vercel.app/logoo.svg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Deen — Belajar Islam Jadi Menyenangkan" />
    <meta
      name="twitter:description"
      content="Belajar Islam melalui materi interaktif, kuis, XP, dan progres belajar."
    />

    <title>Deen</title>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" role="status" aria-label="Memuat halaman">
        <div id="initial-loader-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
